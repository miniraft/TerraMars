[package]
name = "terramars"
version = "0.2.0"
edition = "2024"
description = "A source-backed Mars mission explorer built with Rust and GPUI"
license = "MIT"
default-run = "terramars"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
gpui = { package = "gpui-ce", version = "=0.3.0", default-features = false, features = ["font-kit", "wayland", "x11", "windows-manifest"] }
gpui_platform = { package = "gpui_ce_platform", version = "=0.3.0", features = ["font-kit", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"
log = "0.4"

[build-dependencies]
embed-resource = "3.0"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[profile.dev.package."*"]
debug = 0

[patch.crates-io]
# block 0.1.6 declares an extern static of an uninhabited type, which the
# `uninhabited_static` future-incompat lint will reject. The vendored copy
# changes only that type to an opaque struct. See vendor/GPUI_PATCHES.md.
block = { path = "vendor/block" }
gpui-ce = { path = "vendor/gpui-ce" }
gpui_ce_render = { path = "vendor/gpui_ce_render" }
gpui_ce_linux = { path = "vendor/gpui_ce_linux" }
gpui_ce_macos = { path = "vendor/gpui_ce_macos" }
gpui_ce_windows = { path = "vendor/gpui_ce_windows" }
gpui_ce_wgpu = { path = "vendor/gpui_ce_wgpu" }
gpui_ce_apple = { path = "vendor/gpui_ce_apple" }
