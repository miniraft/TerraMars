name: Desktop builds

on:
  # Branch pushes only: tagged releases are built by release-macos.yml, which
  # signs and notarizes the DMG with the same macos/ metadata and icon.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  build:
    name: Rust / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: linux
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: macos
            runner: macos-15
            target: aarch64-apple-darwin
            macos_deployment_target: '11.0'
          - platform: macos
            runner: macos-15-intel
            target: x86_64-apple-darwin
            macos_deployment_target: '10.15'
          - platform: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: windows
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target || '10.15' }}

    steps:
      - name: Check out project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config \
            libfontconfig1-dev libfreetype6-dev libwayland-dev \
            libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev \
            libssl-dev libasound2-dev libzstd-dev squashfs-tools zsync

      - name: Install AppImage tool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          arch=x86_64
          if [[ "${{ matrix.target }}" == aarch64-* ]]; then arch=aarch64; fi
          url="https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$arch.AppImage"
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/appimagetool "$url"
          chmod +x /tmp/appimagetool
          echo "APPIMAGETOOL=/tmp/appimagetool" >> "$GITHUB_ENV"

      - name: Verify macOS Metal tools and bundle metadata
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          xcrun --find metal
          xcrun --find metallib
          plutil -lint macos/Info.plist macos/entitlements.plist
          # The packager regenerates TerraMars.icns from this logo with sips/iconutil.
          test -s assets/icons/app_logo/logo.png

      # rustup honors the exact version and components in rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          # Select native ARM64 tools even if the image preinstalls x64 rustup.
          rustup set default-host ${{ matrix.target }}
          rustup show
          rustup target add ${{ matrix.target }}
          rustc --version
          cargo --version
          rustc -vV | grep -Fx 'host: ${{ matrix.target }}'

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.target }}-${{ matrix.macos_deployment_target }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ matrix.target }}-${{ matrix.macos_deployment_target }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml') }}-

      - name: Check formatting
        # Keep the vendored upstream compatibility patch independent of style changes.
        run: cargo fmt --package terramars -- --check

      - name: Check Rust code
        run: cargo clippy --locked --release --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: Test calculations and application state
        run: cargo test --locked --release --target ${{ matrix.target }} --all-targets

      - name: Build Rust desktop application
        run: cargo build --locked --release --target ${{ matrix.target }} --bin terramars

      - name: Package native application
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          # Report the compiled target, not the runner's own architecture.
          arch=x86_64
          case "${{ matrix.target }}" in aarch64-*) arch=arm64 ;; esac
          python3 tools/package_desktop.py \
            --platform ${{ matrix.platform }} \
            --binary-dir target/${{ matrix.target }}/release \
            --arch "$arch"
          if [[ "${{ matrix.platform }}" == linux ]]; then
            test -s "dist/TerraMars-linux-$arch.AppImage"
          fi

      - name: Upload native application
        uses: actions/upload-artifact@v7
        with:
          path: dist/TerraMars-*
          # v7 uploads the single native file directly, without a ZIP wrapper.
          archive: false
          if-no-files-found: error
          retention-days: 14
